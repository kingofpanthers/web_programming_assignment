<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill splitter</title><link rel="stylesheet" href="style.css"></head><body><header><strong>FIELDNOTES / Web programming</strong><nav><a href="../../../index.html">All weeks</a><a href="index.html">JavaScript lab</a></nav></header><main><p class="eyebrow">Week 02 / Task 1</p><h1>Share the good times.<br>Split the bill.</h1><form id="split" novalidate><label for="bill">Total bill (£)</label><input id="bill" type="number" min="0" step="0.01" required><label for="tip">Tip</label><select id="tip"><option value="0">0%</option><option value="5">5%</option><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option></select><label for="people">Number of people</label><input id="people" type="number" min="1" step="1" value="2" required><p id="errors" class="error" role="alert"></p><button>Calculate split</button></form><div id="result" class="result" aria-live="polite">Your split will appear here.</div></main><footer>MOD002619 · Learn by building</footer><script src="split.js"></script></body></html>
